<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Checkout - FastBite</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body>

    <!-- ================= NAVBAR ================= -->

    <header class="navbar">

        <div class="container navbar-content">

            <a
                href="index.html"
                class="logo"
            >
                🍔 FastBite
            </a>

            <nav>

                <a href="index.html">
                    Home
                </a>

                <a href="menu.html">
                    Menu
                </a>

                <a href="#">
                    Offers
                </a>

                <a href="#">
                    About
                </a>

                <a href="#">
                    Contact
                </a>

            </nav>

            <div class="nav-actions">

                <button
                    class="cart-btn"
                    onclick="goToCart()"
                >
                    🛒 Cart
                    <span id="cart-count">0</span>
                </button>

            </div>

        </div>

    </header>


    <!-- ================= CHECKOUT HEADER ================= -->

    <section class="checkout-header">

        <div class="container">

            <span class="hero-badge">
                🛍 CHECKOUT
            </span>

            <h1>
                Complete Your
                <span>Order.</span>
            </h1>

            <p>
                Enter your details and confirm your order.
            </p>

        </div>

    </section>


    <!-- ================= CHECKOUT ================= -->

    <section class="checkout-section">

        <div class="container">

            <div class="checkout-layout">


                <!-- ================= CUSTOMER FORM ================= -->

                <div class="checkout-form">

                    <h2>
                        Customer Details
                    </h2>

                    <p class="form-subtitle">
                        Where should we deliver your food?
                    </p>


                    <form id="checkout-form">

                        <!-- NAME -->

                        <div class="form-group">

                            <label for="customer-name">
                                Full Name *
                            </label>

                            <input
                                type="text"
                                id="customer-name"
                                placeholder="Enter your full name"
                                required
                            >

                        </div>


                        <!-- PHONE -->

                        <div class="form-group">

                            <label for="customer-phone">
                                Mobile Number *
                            </label>

                            <input
                                type="tel"
                                id="customer-phone"
                                placeholder="Enter 10 digit mobile number"
                                maxlength="10"
                                required
                            >

                        </div>


                        <!-- EMAIL -->

                        <div class="form-group">

                            <label for="customer-email">
                                Email Address
                            </label>

                            <input
                                type="email"
                                id="customer-email"
                                placeholder="Enter your email"
                            >

                        </div>


                        <!-- ADDRESS -->

                        <div class="form-group">

                            <label for="customer-address">
                                Delivery Address *
                            </label>

                            <textarea
                                id="customer-address"
                                rows="4"
                                placeholder="House no, street, area..."
                                required
                            ></textarea>

                        </div>


                        <!-- CITY -->

                        <div class="form-group">

                            <label for="customer-city">
                                City *
                            </label>

                            <input
                                type="text"
                                id="customer-city"
                                placeholder="Enter your city"
                                required
                            >

                        </div>


                        <!-- DELIVERY -->

                        <div class="form-group">

                            <label>
                                Delivery Option
                            </label>

                            <div class="delivery-options">

                                <label class="delivery-option">

                                    <input
                                        type="radio"
                                        name="delivery"
                                        value="Delivery"
                                        checked
                                    >

                                    <span>
                                        🚴 Home Delivery
                                    </span>

                                </label>


                                <label class="delivery-option">

                                    <input
                                        type="radio"
                                        name="delivery"
                                        value="Pickup"
                                    >

                                    <span>
                                        🏪 Pickup
                                    </span>

                                </label>

                            </div>

                        </div>


                        <!-- PAYMENT -->

                        <div class="form-group">

                            <label>
                                Payment Method
                            </label>

                            <div class="payment-options">

                                <label class="payment-option">

                                    <input
                                        type="radio"
                                        name="payment"
                                        value="Cash on Delivery"
                                        checked
                                    >

                                    <span>
                                        💵 Cash on Delivery
                                    </span>

                                </label>


                                <label class="payment-option">

                                    <input
                                        type="radio"
                                        name="payment"
                                        value="Pay at Counter"
                                    >

                                    <span>
                                        💳 Pay at Counter
                                    </span>

                                </label>

                            </div>

                        </div>


                        <!-- TERMS -->

                        <div class="terms">

                            <label>

                                <input
                                    type="checkbox"
                                    id="terms"
                                    required
                                >

                                I confirm that the information
                                provided is correct.

                            </label>

                        </div>


                        <button
                            type="submit"
                            class="place-order-btn"
                        >
                            🛍 Place Order
                        </button>

                    </form>

                </div>


                <!-- ================= ORDER SUMMARY ================= -->

                <div class="checkout-summary">

                    <h2>
                        Order Summary
                    </h2>


                    <div
                        id="checkout-items"
                        class="checkout-items"
                    >
                        <!-- Items inserted by JS -->
                    </div>


                    <div class="summary-line"></div>


                    <div class="summary-row">

                        <span>
                            Subtotal
                        </span>

                        <strong id="checkout-subtotal">
                            ₹0
                        </strong>

                    </div>


                    <div class="summary-row">

                        <span>
                            Delivery
                        </span>

                        <strong id="checkout-delivery">
                            ₹0
                        </strong>

                    </div>


                    <div class="summary-line"></div>


                    <div class="summary-total">

                        <span>
                            Total
                        </span>

                        <strong id="checkout-total">
                            ₹0
                        </strong>

                    </div>


                    <a
                        href="cart.html"
                        class="back-cart"
                    >
                        ← Back to Cart
                    </a>

                </div>

            </div>

        </div>

    </section>


    <script src="js/main.js"></script>
    <script src="js/checkout.js"></script>

</body>

</html>
