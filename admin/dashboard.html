<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Dashboard - FastBite</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/admin.css">

</head>

<body class="admin-dashboard-page">

    <!-- Sidebar -->

    <aside class="admin-sidebar">

        <div class="admin-brand">
            🍔 FastBite
            <span>Admin Panel</span>
        </div>

        <nav>

            <a href="dashboard.html" class="active">
                📊 Dashboard
            </a>

            <a href="../menu.html">
                🍔 View Menu
            </a>

            <a href="../index.html">
                🏠 View Website
            </a>

        </nav>

        <button id="logoutBtn" class="logout-btn">
            🚪 Logout
        </button>

    </aside>


    <!-- Main Content -->

    <main class="admin-main">

        <div class="admin-topbar">

            <div>
                <h1>Dashboard</h1>

                <p>
                    Welcome back, Admin 👋
                </p>
            </div>

        </div>


        <!-- Statistics -->

        <section class="admin-stats">

            <div class="stat-card">

                <div class="stat-icon">
                    📦
                </div>

                <div>
                    <p>Total Orders</p>
                    <h2 id="totalOrders">0</h2>
                </div>

            </div>


            <div class="stat-card">

                <div class="stat-icon">
                    ⏳
                </div>

                <div>
                    <p>Pending Orders</p>
                    <h2 id="pendingOrders">0</h2>
                </div>

            </div>


            <div class="stat-card">

                <div class="stat-icon">
                    ✅
                </div>

                <div>
                    <p>Delivered Orders</p>
                    <h2 id="deliveredOrders">0</h2>
                </div>

            </div>


            <div class="stat-card">

                <div class="stat-icon">
                    💰
                </div>

                <div>
                    <p>Total Sales</p>
                    <h2 id="totalSales">₹0</h2>
                </div>

            </div>

        </section>


        <!-- Orders -->

        <section class="orders-section">

            <div class="section-header">

                <div>
                    <h2>Recent Orders</h2>

                    <p>
                        Manage customer orders
                    </p>
                </div>

                <button
                    onclick="loadOrders()"
                    class="refresh-btn"
                >
                    🔄 Refresh
                </button>

            </div>


            <div class="table-container">

                <table>

                    <thead>

                        <tr>
                            <th>Order ID</th>
                            <th>Customer</th>
                            <th>Items</th>
                            <th>Total</th>
                            <th>Payment</th>
                            <th>Status</th>
                            <th>Date</th>
                            <th>Action</th>
                        </tr>

                    </thead>

                    <tbody id="ordersTableBody">

                    </tbody>

                </table>

            </div>

        </section>

    </main>


    <!-- Order Details Modal -->

    <div
        id="orderModal"
        class="order-modal"
    >

        <div class="order-modal-content">

            <button
                class="close-modal"
                onclick="closeOrderModal()"
            >
                ×
            </button>

            <h2>Order Details</h2>

            <div id="orderDetails"></div>

        </div>

    </div>


    <script src="../js/admin-dashboard.js"></script>

</body>
</html>
